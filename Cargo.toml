[package]
name = "rustdn"
version = "0.1.0-dev"
edition = "2021"
license-file = "LICENSE.md"

[dependencies]
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
dirs = "5.0.1"
rustix = { version = "0.38.34", default-features = false, features = [
    "fs",
    "std",
] }
clap = { version = "4.5.28", features = ["derive", "string"] }
